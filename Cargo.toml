[package]
name = "ai_usage_collect_scan"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
authors = ["ManonLoki"]
description = "只读 AI 用量扫描、JSONL 解析、统计与可选的按 Agent 分库持久化"
license-file = "LICENSE.zh-CN.md"
readme = "README.md"
publish = false

[features]
default = []
test-util = []
storage = ["dep:sea-orm", "dep:tokio", "dep:tracing", "dep:uuid", "dep:zip"]

[dependencies]
sea-orm = { version = "2.0.4", optional = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
tokio = { version = "1.54.1", optional = true, default-features = false, features = ["fs", "sync", "time"] }
tracing = { version = "0.1.44", optional = true }
uuid = { version = "1.29.0", optional = true, default-features = false, features = ["std", "v4"] }
# 仅用于重建前把本应用旧版本统计库打包备份；只启用纯 Rust 的 zlib-rs deflate 压缩。
zip = { version = "9.1.3", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
jiff = "0.2.38"
same-file = "1.0.6"
whichdisk = { version = "0.6.0", default-features = false, features = ["list"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSMetadata", "NSMetadataAttributes", "NSObject", "NSPathUtilities", "NSPredicate", "NSRunLoop", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["std", "Foundation", "Storage", "Storage_Search", "Storage_Streams"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
