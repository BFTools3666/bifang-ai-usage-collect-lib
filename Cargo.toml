[package]
name = "ai_usage_collect_scan"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["ManonLoki"]
description = "只读 AI 用量扫描、JSONL 解析与统计；存储由客户端实现"
license-file = "LICENSE.zh-CN.md"
readme = "README.md"
publish = false

[features]
default = []
test-util = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
jiff = "0.2.38"
same-file = "1.0.6"
whichdisk = { version = "0.6.0", default-features = false, features = ["list"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSMetadata", "NSMetadataAttributes", "NSObject", "NSPathUtilities", "NSPredicate", "NSRunLoop", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Foundation", "Storage", "Storage_Search", "Storage_Streams"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
